<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">VBSPU Campus — Campus Blog &amp; Virtual Showcase</title>
  <desc id="desc">GitHub banner for the VBSPU Campus project by Raj Gautam (@Rg100152).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#131822"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#D4A359"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E05A47"/>
      <stop offset="1" stop-color="#C84B31"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0E14" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#0B0E14" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0B0E14" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#C84B31" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#C84B31" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="photoClip"><rect x="690" y="58" width="452" height="514" rx="26"/></clipPath>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#D4A359" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1010" cy="250" r="330" fill="url(#glow)"/>
  <circle cx="120" cy="600" r="260" fill="url(#glow)" opacity="0.45"/>

  <!-- Decorative heritage arches -->
  <g fill="none" stroke="#D4A359" stroke-opacity="0.18" stroke-width="2">
    <path d="M-40 630V300a150 150 0 0 1 300 0v330"/>
    <path d="M30 630V320a80 80 0 0 1 160 0v310"/>
  </g>
  <path d="M0 630h340" stroke="#C84B31" stroke-opacity="0.5" stroke-width="4"/>

  <!-- Campus photograph with gradient veil -->
  <g clip-path="url(#photoClip)">
    <rect x="690" y="58" width="452" height="514" fill="#1B2230"/>
    <image href="campus/vbspu-campus-about.jpg" x="690" y="58" width="452" height="514" preserveAspectRatio="xMidYMid slice"/>
    <rect x="690" y="58" width="452" height="514" fill="url(#veil)"/>
    <rect x="690" y="58" width="452" height="514" fill="none" stroke="#D4A359" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- Content -->
  <g font-family="'Plus Jakarta Sans','Poppins',Arial,sans-serif">
    <text x="78" y="92" font-size="17" letter-spacing="6" fill="#D4A359">CAMPUS BLOG &amp; VIRTUAL SHOWCASE</text>
    <text x="78" y="230" font-family="'Playfair Display','Cinzel',Georgia,serif" font-size="104" font-weight="700" fill="url(#gold)">VBSPU</text>
    <text x="80" y="312" font-family="'Playfair Display','Cinzel',Georgia,serif" font-size="76" font-weight="700" fill="#E05A47">CAMPUS</text>
    <path d="M80 350h116" stroke="url(#brick)" stroke-width="5" stroke-linecap="round"/>
    <text x="78" y="402" font-family="'Noto Sans Devanagari','Plus Jakarta Sans',sans-serif" font-size="22" fill="#F2C94C">वीर बहादुर सिंह पूर्वांचल विश्वविद्यालय</text>
    <text x="78" y="440" font-size="19" fill="#A9B4C6">Jaunpur, Uttar Pradesh · Est. 1987</text>

    <g transform="translate(78 476)">
      <rect width="420" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.05" stroke="#D4A359" stroke-opacity="0.28"/>
      <circle cx="30" cy="26" r="7" fill="#2D6A4F"/>
      <text x="50" y="32" font-size="15" letter-spacing="1.5" fill="#D8DEE9">HERITAGE · ARCHITECTURE · STUDENT LIFE</text>
    </g>

    <text x="78" y="584" font-size="17" fill="#C7D0DE">Developed &amp; Designed by <tspan fill="#F2C94C" font-weight="700">Raj Gautam</tspan> · <tspan fill="#E05A47">@Rg100152</tspan></text>
    <text x="1122" y="584" font-size="14" text-anchor="end" fill="#7E899B">MIT License · vbspu-campus</text>
  </g>
</svg>
